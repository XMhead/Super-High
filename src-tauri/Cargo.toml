[package]
name = "super-high"
version = "0.1.0"
edition = "2021"
authors = ["OpenAI Codex"]
default-run = "super-high"

[package.metadata.tauri-winres]
ProductName = "Super High"
FileDescription = "Super High desktop workspace"
OriginalFilename = "super-high.exe"

[lib]
name = "super_high_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "superhigh-cli"
path = "src/bin/superhigh_cli.rs"

[[bin]]
name = "superhigh-agent"
path = "src/bin/superhigh_agent.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
once_cell = "1"
notify = "8.2.0"
portable-pty = "0.8"
regex = "1"
rfd = "0.15"
reqwest = { version = "0.13", features = ["json", "native-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
