schema: agent-skill-v1
name: superhigh-public-publish
workflows:
  review_evidence:
    summary: 根据证据审核公开源码脱敏
    keywords:
    - 公开源码脱敏
    inputs:
      evidence:
        type: string
        required: true
        description: 目标、来源与已取得的具体证据
    steps:
    - id: review
      judge: 源码快照、脱敏检查及目标范围是否满足公开条件？
      evidence:
        $ref: inputs.evidence
      returns:
        passed:
          type: boolean
          required: true
        reason:
          type: string
          required: true
    - require:
        $ref: steps.review.result.passed
      message: 证据尚不足以通过审核
    outputs:
      review:
        $ref: steps.review.result
