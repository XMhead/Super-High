schema: agent-skill-v1
name: super-high-ui-constraints
workflows:
  review_evidence:
    summary: 根据证据审核界面设计与实现
    keywords:
    - 界面设计与实现
    inputs:
      evidence:
        type: string
        required: true
        description: 目标、来源与已取得的具体证据
    steps:
    - id: review
      judge: 界面证据是否符合现有布局、主题、字体与交互约束？
      evidence:
        $ref: inputs.evidence
      returns:
        passed:
          type: boolean
          required: true
        reason:
          type: string
          required: true
    - require:
        $ref: steps.review.result.passed
      message: 证据尚不足以通过审核
    outputs:
      review:
        $ref: steps.review.result
